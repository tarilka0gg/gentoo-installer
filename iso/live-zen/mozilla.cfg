// Autoconfig for the live session's Zen (installed by get-zen next to policies.json): the extensions of the profile open a welcome page
// the first time they are installed (CanvasBlocker's presets, LocalCDN's "Hello", SponsorBlock's help). This closes exactly those pages
// during the first minutes of the browser, so a fresh live session opens on a clean start page.
try {
  const closeThese = [
    /^moz-extension:\/\/[^/]+\/options\/presets\.html\?notice=install/,
    /^moz-extension:\/\/[^/]+\/pages\/welcome\/welcome\.html/,
    /^moz-extension:\/\/[^/]+\/help\/index\.html/,
  ];
  const until = Date.now() + 5 * 60 * 1000;
  Services.obs.addObserver({
    observe(win) {
      win.gBrowser.addTabsProgressListener({
        onLocationChange(browser, webProgress, request, location) {
          if (Date.now() > until || !webProgress.isTopLevel || !location) return;
          if (!closeThese.some(re => re.test(location.spec))) return;
          const tab = win.gBrowser.getTabForBrowser(browser);
          if (tab) win.setTimeout(() => win.gBrowser.removeTab(tab), 0);
        },
      });
    },
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError("live-zen autoconfig: " + e);
}
