[workspace]
resolver = "2"
members = [
    "installer-core",
    "installer-cli",
    "installer-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
installer-core = { path = "installer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "macros", "io-util", "sync", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
zbus = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
